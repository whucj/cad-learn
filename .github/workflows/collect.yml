name: 采集并发布

on:
  schedule:
    # 每天 4 个时段触发（UTC，都避开 DeepSeek 高峰：工作日 01–04、06–10）。
    # 实际是否运行由 config.yaml 的 schedule（更新周期）决定，不到时间的触发几秒内跳过。
    # 每个时段单独一行，脚本据此识别是哪个时段（即使 GitHub 延迟触发也不会认错）。
    # 修改时段需同时修改 collector/lib/schedule.dart 的 slotHours。
    - cron: '30 4 * * *'
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch: # 可在 Actions 页面手动运行（总是执行）
  push:
    branches: [main]
    paths: ['config.yaml', 'collector/**', 'web/**', '.github/workflows/**']

permissions:
  contents: write # 提交 data/
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 检查是否到了更新时间
        id: gate
        working-directory: collector
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          dart pub get
          dart run bin/should_run.dart --root ..

      - name: 采集器测试（仅代码变更时）
        if: github.event_name == 'push'
        working-directory: collector
        run: dart test

      - name: 抓取订阅源 + AI 摘要
        if: steps.gate.outputs.run == 'true'
        working-directory: collector
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: dart run bin/collect.dart --root ..

      - name: 提交数据
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建网页
        if: steps.gate.outputs.run == 'true'
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
